        const u=Math.min(1,(t-fly.t0)/fly.dur),v=fly.dir>0?u:1-u;
        lon=fly.lon0+fly.dl*outc(v);lat=fly.lat0+(TLAT-fly.lat0)*ease(v);
        const z=Math.max(0,Math.min(1,(v-.35)/.65));zp=ease(z);k=Math.exp(Math.log(KZ)*ease(z));
        if(u>=1){const f=fly;fly=null;if(f.dir>0){lon=TLON;lat=TLAT;k=KZ;zp=1}else{lon=TLON;zp=0;k=1;lat=-22}f.cb&&f.cb()}
      }else if(!zp)lon+=dt*0.006;
      draw()}
    last=t;requestAnimationFrame(tick);
  }
  if('ResizeObserver' in window)new ResizeObserver(()=>{W=0;draw()}).observe(box);else window.addEventListener('resize',()=>{W=0;draw()});
  draw();
  if(!still)requestAnimationFrame(tick);
  function go(dir,cb){
    if(fly)return;
    if(dir>0){const l0=((lon%360)+360)%360;let dl=(((TLON-l0)%360)+360)%360+360*2;
      fly={dir:1,t0:performance.now(),dur:3000,lon0:l0,dl:dl,lat0:lat,cb:cb};}
    else{fly={dir:-1,t0:performance.now(),dur:1800,lon0:TLON-360,dl:360,lat0:-22,cb:cb}}
    if(still){fly=null;if(dir>0){lon=TLON;lat=TLAT;k=KZ;zp=1}else{k=1;zp=0;lat=-22}draw();cb&&cb()}
  }
  function pick(cx,cy){
    if(zp<.95||fly)return null;
    const r=cv.getBoundingClientRect();if(!r.width)return null;
    const ll=proj.invert([(cx-r.left)/r.width*W,(cy-r.top)/r.height*W]);if(!ll)return null;
    for(const f of kr.features)if(d3.geoContains(f,ll))return f.properties.n;
    return null;
  }
  cv.addEventListener('mousemove',e=>{const n=pick(e.clientX,e.clientY);if(n!==hov){hov=n;cv.style.cursor=n?'pointer':'default'}});
  cv.addEventListener('mouseleave',()=>{hov=null});
  cv.addEventListener('click',e=>{const n=pick(e.clientX,e.clientY);if(n&&window.mohamPick)window.mohamPick(n)});
  window.mohamGlobe={go:go,isZoomed:()=>zp>0||(fly&&fly.dir>0)};
})();
</script>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const root=document.documentElement;
  let ready=false,db=null,uid=null,member=null,isOwner=false,dbOK=false,mode='join',busy=false,leaveArmed=false;
  const SK='moham_ek';
  const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

  /* 메뉴 */
  const mb=$('mb'),menu=$('menu'),shade=$('shade');
  function openMenu(o){menu.hidden=!o;shade.hidden=!o;mb.setAttribute('aria-expanded',o?'true':'false');if(!o)mb.focus()}
  mb.addEventListener('click',()=>openMenu(menu.hidden));
  shade.addEventListener('click',()=>openMenu(false));
  $('hint').addEventListener('click',()=>openMenu(true));
  function toggleKR(){const o=$('mSub').hidden;$('mSub').hidden=!o;$('mPlus').textContent=o?'−':'+';$('mPlus').setAttribute('aria-expanded',o?'true':'false');$('mKR').setAttribute('aria-expanded',o?'true':'false')}
  $('mPlus').addEventListener('click',toggleKR);$('mKR').addEventListener('click',toggleKR);
  $('mHome').addEventListener('click',()=>{openMenu(false);if(typeof backToGlobe==='function')backToGlobe()});
  $('mTheme').addEventListener('click',()=>{
    const cur=root.getAttribute('data-theme');
    const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme',dark?'light':'dark');
  });

  /* 암호 처리: 이메일은 해시만, 비밀번호는 소금+PBKDF2 해시만 저장 (원문은 저장하지 않음) */
  const enc=new TextEncoder();
  const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
  async function emailKey(e){return hex(await crypto.subtle.digest('SHA-256',enc.encode('moham:'+e.trim().toLowerCase()))).slice(0,40)}
  async function pwHash(pw,saltHex,it){
    const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(saltHex),iterations:it,hash:'SHA-256'},k,256));
  }

  /* 화면 반영 */
  function paint(){
    const isIn=!!member;
    ['mHome','mFood','mTour','mHosp','mKids','mAuto','mStay','mTheme'].forEach(id=>{const b=$(id);b.disabled=!isIn;b.title=isIn?'':'로그인·회원가입 후 이용할 수 있습니다'});
    $('hint').hidden=isIn;
    $('mLogin').hidden=isIn;$('mJoin').hidden=isIn;$('mOut').hidden=!isIn||!!member.admin;
    $('mAdmin').hidden=!isOwner;$('mAdmin').disabled=false;
    $('who').textContent=isIn?(member.admin?'관리자':member.nick+'님'):'';
    $('mLeave').hidden=!(isIn&&member.uid&&member.uid===uid);
    $('mLeave').textContent=leaveArmed?'정말 탈퇴하시겠습니까? 한 번 더 누르세요':'탈퇴';
    const locked=!ready||!isIn;
    document.body.classList.toggle('locked',locked);
    if(ready&&!isIn){if($('veil').hidden)openModal(mode)}
    else if(isIn){$('veil').hidden=true}
  }
  function msg(t,err){const m=$('gmsg');m.textContent=t||'';m.className=err?'err':''}

  /* 가운데 입력창 */
  function openModal(m){
    mode=m;openMenu(false);
    $('mt').textContent=m==='join'?'회원가입':'로그인';
    $('mgo').textContent=m==='join'?'가입하기':'로그인';
    $('pw').setAttribute('autocomplete',m==='join'?'new-password':'current-password');
    $('nkw').hidden=m!=='join';
    $('msw').textContent='';
    const b=document.createElement('button');b.type='button';
    b.textContent=m==='join'?'로그인':'회원가입';
    b.addEventListener('click',()=>openModal(m==='join'?'login':'join'));
    $('msw').append(m==='join'?'이미 회원이신가요? ':'아직 회원이 아니신가요? ',b);
    msg('');$('veil').hidden=false;$('em').focus();
  }
  function closeModal(){if(!member){$('pw').value='';return}$('veil').hidden=true;$('pw').value='';msg('')}
  $('mx').addEventListener('click',closeModal);
  $('veil').addEventListener('mousedown',e=>{if(e.target===$('veil'))closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('veil').hidden)closeModal();else if(!menu.hidden)openMenu(false)}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('fveil').hidden)foodClose();else if(!$('gback').hidden)backToGlobe();$('aveil').hidden=true}});
  $('mJoin').addEventListener('click',()=>openModal('join'));
  $('mLogin').addEventListener('click',()=>openModal('login'));
  $('hint').addEventListener('click',()=>openModal('login'));

  async function submit(ev){
    ev.preventDefault();if(busy)return;
    const email=$('em').value.trim(),pw=$('pw').value,nick=$('nk').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg('이메일 주소를 확인해 주세요.',true);$('em').focus();return}
    if(pw.length<8){msg('비밀번호는 8자 이상이어야 합니다.',true);$('pw').focus();return}
    if(mode==='join'&&(nick.length<2)){msg('별명은 2자 이상 적어 주세요.',true);$('nk').focus();return}
    if(!dbOK){msg('먼저 claude.ai에 로그인한 상태로 이 주소를 다시 열어 주세요.',true);return}
    busy=true;$('mgo').disabled=true;msg(mode==='join'?'가입하는 중…':'확인 중…');
    try{
      const ek=await emailKey(email);
      const q=await db.collection('accounts').where('ek','==',ek).limit(1).get();
      const hit=q.docs.find(d=>d.exists);
      if(mode==='join'){
        if(hit){msg('이미 가입된 이메일입니다. 로그인해 주세요.',true);return}
        if(!uid){msg('가입할 수 없는 상태입니다. claude.ai 로그인을 확인해 주세요.',true);return}
        const mine=await db.doc('accounts/'+uid).get();
        if(mine.exists){msg('이 계정으로 이미 가입한 회원 정보가 있습니다. 로그인해 주세요.',true);return}
        const bytes=crypto.getRandomValues(new Uint8Array(16)),salt=hex(bytes),it=200000;
        await db.doc('accounts/'+uid).set({ek,nick,salt,it,hash:await pwHash(pw,salt,it),t:Date.now()});
        member={nick,uid,ek};lsSet(SK,ek);closeModal();paint();
      }else{
        if(!hit){msg('이메일 또는 비밀번호가 맞지 않습니다.',true);return}
        const v=hit.data();
        if(await pwHash(pw,v.salt,v.it)!==v.hash){msg('이메일 또는 비밀번호가 맞지 않습니다.',true);return}
        member={nick:v.nick,uid:hit.id,ek};lsSet(SK,ek);closeModal();paint();
      }
    }catch(e){
      msg(e&&e.code==='invalid_argument'?'이 링크는 보기만 가능한 권한이라 가입할 수 없습니다. 링크를 보낸 사람에게 "편집 가능" 권한을 요청해 주세요.':'처리하지 못했습니다. 잠시 뒤 다시 시도해 주세요.',true);
    }finally{busy=false;$('mgo').disabled=false}
  }
  $('mf').addEventListener('submit',submit);

  $('mOut').addEventListener('click',()=>{member=null;lsSet(SK,null);leaveArmed=false;paint();openMenu(false)});
  $('mLeave').addEventListener('click',async()=>{
    if(!leaveArmed){leaveArmed=true;paint();setTimeout(()=>{leaveArmed=false;paint()},4000);return}
    leaveArmed=false;
    try{await db.doc('accounts/'+uid).delete();member=null;lsSet(SK,null)}catch(e){}
    paint();
  });

  /* 시작: 이전에 로그인한 기록이 있으면 회원 정보를 다시 확인 */

    paint();
